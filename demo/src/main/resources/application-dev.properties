# DATABASE CONFIGURATIONS

spring.datasource.url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:dockmind}
# PostgreSQL database ka connection URL.

spring.datasource.username: ${DB_USER:postgres}
# PostgreSQL database ka username.

spring.datasource.password: ${DB_PASSWORD:postgres}
# PostgreSQL database ka password.


# JPA / HIBERNATE CONFIGURATIONS

spring.jpa.hibernate.ddl-auto: update
# Hibernate entities ke according database schema/tables ko update karta hai.

spring.jpa.show-sql: true
# Hibernate ki generated SQL queries console mein dikhata hai.

spring.jpa.properties.hibernate.format_sql: true
# Generated SQL queries ko readable/formatted format mein dikhata hai.


# OPENAI / SPRING AI CONFIGURATIONS

spring.ai.openai.api-key: ${OPENAI_API_KEY:demo-key}
# OpenAI API ko access karne ke liye API key.

spring.ai.openai.chat.model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
# Chat/LLM ke liye kaunsa OpenAI model use karna hai.

spring.ai.openai.chat.temperature: 0.2
# Model ke response ki randomness/creativity control karta hai.

spring.ai.openai.embedding.model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
# Text ko numerical vector/embedding mein convert karne wala model.


# PG VECTOR CONFIGURATIONS

spring.ai.vectorstore.pgvector.index-type: HNSW
# Vector similarity search ko efficient banane ke liye indexing technique.

spring.ai.vectorstore.pgvector.distance-type: COSINE_DISTANCE
# Vectors ke beech similarity/distance calculate karne ka method.

spring.ai.vectorstore.pgvector.dimensions: 1536
# Embedding vector ki dimensions ki number.

spring.ai.vectorstore.pgvector.table-name: vector_store
# PostgreSQL mein vectors kis table mein store honge.

spring.ai.vectorstore.pgvector.schema-name: public
# PostgreSQL ka kaunsa schema use hoga.

spring.ai.vectorstore.pgvector.initialize-schema: true
# Vector store ka required database schema initialize karne deta hai.


# FILE UPLOAD CONFIGURATIONS

spring.servlet.multipart.max-file-size: 25MB
# Ek individual uploaded file ka maximum size.

spring.servlet.multipart.max-request-size: 50MB
# Puri multipart request ka maximum size.


# APPLICATION / RAG CONFIGURATIONS

app.rag.chunk-size: 700
# Document ko chunks mein todne ke liye configured chunk size.

app.rag.top-k: 5
# Similarity search ke baad top 5 relevant chunks retrieve karne hain.

app.rag.similarity-threshold: 0.0
# Retrieved chunks ke liye minimum similarity/relevance threshold.


# CORS CONFIGURATIONS

app.cors.allowed-origins: "*"
# Kisi bhi frontend origin se request allow kar raha hai.

app.cors.allowed-methods: GET,POST,PUT,DELETE,OPTIONS
# Ye HTTP methods backend par allowed hain.

app.cors.allowed-headers: "*"
# Kisi bhi request headers ko allow kar raha hai.


# JWT CONFIGURATION

jwt.secret: ${JWT_SECRET:sdafasfasfasdhfojhascapfdaDHAfbashfabfashfasbfshfdasfhqf}
# JWT ko sign aur verify karne ke liye secret key.

jwt.expiration: 3600000
# JWT token ki expiry; milliseconds hone par 3600000 = 1 hour.


# CUSTOM BOOT UI CONFIGURATION

bootui.enabled: ON
# Project ki custom property jo Boot UI ko enable/disable kar sakti hai.


# LOGGING CONFIGURATION

logging.level.org.springframework.ai.chat.client.advisor: DEBUG
# Spring AI advisor ke logs ka logging level DEBUG par set karta hai.